[project]
name = "tipcraft-learning-runtime"
version = "0.1.0"
description = "Pinned, isolated runtime for the retrospective learning experiment"
requires-python = "==3.12.5"
dependencies = [
  "tipcraft",
  "catboost==1.2.7",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
]

[tool.uv.sources]
tipcraft = { path = "../..", editable = true }
