[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "tipcraft"
version = "0.1.0"
description = "Evidence-first retrospective evaluation for the UWCSEA iGEM 2027 proposal"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
tipcraft = "tipcraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tipcraft"]
